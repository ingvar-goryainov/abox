# MCP servers run by kagent's kmcp controller. kmcp creates a Service named
# after the MCPServer and adapts stdio servers to streamable HTTP.
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: neo4j-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: neo4j/mcp:v1.6.0
    cmd: /app/neo4j-mcp
    env:
      NEO4J_MCP_URI: bolt://neo4j.neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      # Matches releases/neo4j.yaml.
      NEO4J_MCP_PASSWORD: abox-neo4j
      NEO4J_MCP_DATABASE: neo4j
      NEO4J_MCP_READ_ONLY: "false"
      NEO4J_MCP_TELEMETRY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  timeout: 120s
  deployment:
    # Ours; scaffolded with `kmcp init go`, source in mcp/qdrant-mcp. Runs
    # alongside the official mcp-server-qdrant below rather than replacing it:
    # the two embed with different models into different collections.
    image: ghcr.io/den-vasyliev/abox/qdrant-mcp:0.5.0
    cmd: /app/server
    env:
      # Any OpenAI-compatible /v1/embeddings route. The standalone llama.cpp
      # Deployment, serving nomic-embed-text-v1.5 as f16 at 8 slots x 2048 ctx.
      # This is the starting point of the migration exercise; the other route is
      # llm-d's decode Service:
      #
      #   http://llm-d-embedding.llm-d:8000
      #
      # hit directly rather than through the EPP, whose scorers are built for
      # generation traffic, not a pooling runner's single-shot embed. Direct
      # means no model-based routing, so EMBEDDINGS_MODEL stays unset there too:
      # llama.cpp ignores it and serves the one GGUF it was given. A managed
      # endpoint would need EMBEDDINGS_MODEL and EMBEDDINGS_API_KEY -- see
      # mcp/qdrant-mcp/README.md, "Switching the embeddings backend".
      #
      # chat returns 501 against either: both are started with --embeddings and
      # have no generation head.
      EMBEDDINGS_BASE_URL: http://llama-cpp-embeddings.llama-cpp:8090
      # vector_store / vector_find embed through the same endpoint, so the
      # agent's memory lands in the vector space the gateway serves. The
      # collection is named for that space. llm-d serves the same model at Q8_0
      # rather than f16 -- same 768 dims, different kernels -- so the two routes
      # are two spaces and the vectors do not transfer. Repointing
      # EMBEDDINGS_BASE_URL is therefore a re-embed, not a copy.
      QDRANT_URL: http://qdrant.qdrant:6333
      QDRANT_COLLECTION: abox-nomic
      # The 7000 default was derived from prose at ~3.4 chars/token. Indented
      # YAML tokenizes denser: a 7000-char slice of an Agent manifest measures
      # over the 2048-token slot this endpoint serves (16384 ctx / 8 slots) and
      # llama.cpp rejects it outright --
      #
      #   input (2075 tokens) is too large to process. increase the physical
      #   batch size (current batch size: 2048)
      #
      # 3500 keeps a chunk near 1000-1400 tokens with room for the
      # search_document: prefix, which comes out of the same budget.
      EMBEDDING_MAX_INPUT_CHARS: "3500"
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp-official
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  timeout: 120s
  deployment:
    image: ghcr.io/ingvar-goryainov/abox/mcp-server-qdrant:0.8.1-4de8aa2
    cmd: /usr/local/bin/mcp-server-qdrant
    env:
      QDRANT_URL: http://qdrant.qdrant:6333
      COLLECTION_NAME: abox-minilm
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      FASTEMBED_CACHE_PATH: /opt/fastembed
      QDRANT_SEARCH_LIMIT: "5"
      TOOL_STORE_DESCRIPTION: >-
        Index a Kubernetes manifest or a note for later semantic search. Pass
        the full text as `information` and put path, kind, name and namespace
        in `metadata` so a hit can be traced back to its source.
      TOOL_FIND_DESCRIPTION: >-
        Semantic search over what qdrant-store has indexed: Kubernetes
        manifests, OpenTofu, scripts and docs. Use it for questions about the
        content of an object -- what it configures, which file does X, where
        something is set. Returns the stored text with its metadata, best
        match first.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
